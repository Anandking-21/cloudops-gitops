apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-backend
  namespace: default
  labels:
    app: cloudops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-backend
  template:
    metadata:
      labels:
        app: cloudops-backend
    spec:
      containers:
      - name: backend
        image: cloudops-backend:9fd612419848896ab572ececee9e7f8382568a58
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-backend-svc
  namespace: default
  labels:
    app: cloudops-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  selector:
    app: cloudops-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudops-backend-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudops-backend-svc
            port:
              number: 8000
